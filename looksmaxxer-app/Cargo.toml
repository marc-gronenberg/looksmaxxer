[package]
name = "looksmaxxer-app"
description = "Looksmaxxer: die Werkbank für die Look-Kette in PhotoCraft (ein Fenster mit der System-Webansicht, für macOS, Windows und Linux)"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "looksmaxxer"
path = "src/main.rs"

[dependencies]
serde_json = "1.0.152"
tao = "0.37.1"
wry = "0.57.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21.2"
