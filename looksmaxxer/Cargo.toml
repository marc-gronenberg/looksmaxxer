[package]
name = "looksmaxxer"
description = "Looksmaxxer: die Look-Kette mit frei sortierten Tools, als PhotoCraft-Filter-Plug-in und als Vorschau-Filter im Browser (ein WebAssembly-Modul für beides)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "looksmaxxer"
crate-type = ["cdylib", "rlib"]

[dependencies]
look-kette-core = { path = "../core" }
