# Look-Kette (Prototyp): ein gemeinsamer Kern und je ein dünner Adapter für EffectCraft,
# PhotoCraft und Looksmaxxer (frei sortierte Kette). Alle bauen:
#
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown \
#     -p look-kette-effectcraft -p look-kette-photocraft -p looksmaxxer
#
# Ergebnis in target/wasm32-unknown-unknown/release/: look_kette_effectcraft.wasm,
# look_kette_photocraft.wasm und looksmaxxer.wasm.
# Looksmaxxer selbst danach: cargo build --release -p looksmaxxer-app
# Tests: `cargo test`.
[workspace]
resolver = "3"
members = ["core", "effectcraft", "photocraft", "looksmaxxer", "looksmaxxer-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
